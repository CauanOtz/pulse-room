name: Release Windows application

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets the same verification run on demand, without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      # Deliberately without room credentials: the end-to-end run must never
      # join the real room, where it would appear as a stranger to everyone in
      # the call and publish the runner's own screen.
      - name: Run complete verification
        run: npm run verify

      - name: Keep the failing end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_ROOM_ACCESS_CODE: ${{ secrets.VITE_ROOM_ACCESS_CODE }}
        run: npm run package:windows

      - name: Publish GitHub release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
