name: Verify Android application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'package.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        working-directory: android
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-room-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: android/app/build/reports

  # The interface and the encrypted session vault can only be judged by a real
  # Android runtime, so they run on an emulator rather than on the JVM.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the interface tests on a device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: bash gradlew connectedDebugAndroidTest
      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-results
          path: android/app/build/reports
