name: Release Windows application

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets the same verification run on demand, without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

# Everything that can run at once does: the checks, the end-to-end run split
# over three machines, the installer and the phone build. Only the last job
# publishes, and only once every one of them has passed, so a release still
# never goes out with a failing test.
jobs:
  checks:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package version v$version"
            exit 1
          fi

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e:
    name: End-to-end (${{ matrix.shard }}/3)
    runs-on: windows-latest
    strategy:
      # One failing part still lets the others report what they found.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for the end-to-end run
        run: npm run build:e2e

      # Deliberately without room credentials: the end-to-end run must never
      # join the real room, where it would appear as a stranger to everyone in
      # the call and publish the runner's own screen.
      - name: Run this part of the end-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Keep the failing end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Built on a manual run too, so a change to the build is tried before a tag.
  installer:
    name: Windows installer
    runs-on: windows-latest
    env:
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run package:windows

      - name: Keep the installer for publishing
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 3

  # The phone build is published beside the Windows installer, signed with the
  # identity the friends' phones already trust, so updates install over the top.
  android:
    name: Android application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Version 3 asked the package manager for 'tools', which the current SDK
      # no longer carries, and the step failed with nothing but an exit code.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "The Android signing identity is missing."; exit 1; fi
          # Secrets can carry the line endings of the machine that stored them.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/pulse-room-android.jks"

      - name: Build the signed application
        working-directory: android
        env:
          PULSE_ANDROID_KEYSTORE: ${{ runner.temp }}/pulse-room-android.jks
          PULSE_ANDROID_KEY_ALIAS: pulse-room
          PULSE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PULSE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the file after the release
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk "android-release/Pulse-Room-Android-$version.apk"

      - name: Confirm the file is signed
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs android-release/*.apk

      - name: Keep the application for publishing
        uses: actions/upload-artifact@v4
        with:
          name: android-application
          path: android-release/*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Remove the signing identity
        if: always()
        run: rm -f "$RUNNER_TEMP/pulse-room-android.jks"

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, e2e, installer, android]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the installer and the application
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub release files
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/*.exe
            release-files/*.blockmap
            release-files/latest.yml
            release-files/*.apk

      # Every open app asks its updater as soon as the files above are there,
      # instead of at its next check. A missing secret or a server that cannot
      # be reached costs only that: the release itself is already out.
      - name: Tell open apps about the release
        env:
          RELEASE_HOOK_SECRET: ${{ secrets.RELEASE_HOOK_SECRET }}
          API_URL: ${{ vars.VITE_API_URL }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$RELEASE_HOOK_SECRET" ] || [ -z "$API_URL" ]; then
            echo "No release hook configured; open apps will find the update at their next check."
            exit 0
          fi
          answer="$(curl --silent --show-error --fail --max-time 20 \
            -X POST "${API_URL%/}/api/hooks/release" \
            -H "Authorization: Bearer $RELEASE_HOOK_SECRET" \
            -H 'Content-Type: application/json' \
            --data "{\"version\":\"${VERSION#v}\"}")" \
            && echo "Told $(printf '%s' "$answer" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).told') open apps about ${VERSION#v}." \
            || echo "::warning::Could not tell open apps about the release."
