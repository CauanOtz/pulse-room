name: Release Windows application

on:
  push:
    tags:
      - 'v*.*.*'
  # Lets the same verification run on demand, without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$packageVersion"
          }

      # Deliberately without room credentials: the end-to-end run must never
      # join the real room, where it would appear as a stranger to everyone in
      # the call and publish the runner's own screen.
      - name: Run complete verification
        run: npm run verify

      - name: Keep the failing end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run package:windows

      - name: Publish GitHub release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  # The phone build is published beside the Windows installer, signed with the
  # identity the friends' phones already trust, so updates install over the top.
  android:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "The Android signing identity is missing."; exit 1; fi
          # Secrets can carry the line endings of the machine that stored them.
          printf '%s' "$KEYSTORE" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/pulse-room-android.jks"

      - name: Build the signed application
        working-directory: android
        env:
          PULSE_ANDROID_KEYSTORE: ${{ runner.temp }}/pulse-room-android.jks
          PULSE_ANDROID_KEY_ALIAS: pulse-room
          PULSE_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PULSE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Name the file after the release
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p android-release
          cp android/app/build/outputs/apk/release/app-release.apk "android-release/Pulse-Room-Android-$version.apk"

      - name: Confirm the file is signed
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$apksigner" verify --print-certs android-release/*.apk

      - name: Publish the Android file
        uses: softprops/action-gh-release@v2
        with:
          files: android-release/*.apk

      - name: Remove the signing identity
        if: always()
        run: rm -f "$RUNNER_TEMP/pulse-room-android.jks"
